[project]
name = "eikon-tagger"
version = "0.1.0"
description = "WD v3 image tagger service for Eikon (runs on the GPU box)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11.0",
  "numpy>=2.0",
  "huggingface-hub>=0.26",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
# Pick exactly one runtime: `gpu` in the container, `cpu` for local development and tests.
# onnxruntime-gpu 1.27+ targets CUDA 13 (driver >= 580); stay on CUDA 12 + cuDNN 9.
gpu = ["onnxruntime-gpu>=1.22,<1.27"]
cpu = ["onnxruntime>=1.22"]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "onnx>=1.17"]

[project.scripts]
eikon-tagger = "eikon_tagger.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eikon_tagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
